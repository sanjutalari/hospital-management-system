databases:
  - name: HMS
    plan: free
    region: singapore

services:
  # ─── BACKEND ───────────────────────────────────────────────
  - type: web
    name: hms-api
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm ci && npx prisma generate --schema prisma/schema.postgres.prisma
    startCommand: npx prisma db push --schema prisma/schema.postgres.prisma && npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: HMS
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: FRONTEND_URL
        fromService:
          name: hms-frontend
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      # Optional: Add CLOUDINARY_URL here if using actual report uploads

  # ─── FRONTEND ──────────────────────────────────────────────
  - type: web
    name: hms-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: hms-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_SOCKET_URL
        fromService:
          name: hms-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
